name: "Step 1 - Install SDK"

# Triggers every time the learner pushes to main. Runs the Step 1 checker
# script; only acts on the result if exercises/practice1.py was touched (or
# on any push, cheaply — the checker script itself no-ops fast if the file
# is missing).

on:
  push:
    branches: [main]
    paths:
      - "exercises/practice1.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  check_step1:
    name: Verify Step 1 exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Run checker
        id: run_checker
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
        run: python .github/scripts/check_step1.py

      - name: Find open Step 1 issue
        if: success()
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-1" --state open --json number --jq '.[0].number')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment success + close issue
        if: success() && steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "✅ **Step 1 complete!** Your SDK install and client setup look correct. Opening Step 2 now..."
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

      - name: Open Step 2 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "step-2" --state all --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh label create "step-2" --color "0E8A16" --force 2>/dev/null || true
            gh label create "course" --color "5319E7" --force 2>/dev/null || true
            gh issue create \
              --repo "${{ github.repository }}" \
              --assignee "${{ github.actor }}" \
              --title "Step 2: Your first messages.create() call" \
              --label "step-2,course" \
              --body-file .github/steps/02-first-message.md
          fi

      - name: Disable this workflow, enable Step 2 checker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "Step 1 - Install SDK" --repo "${{ github.repository }}" || true
          gh workflow enable "Step 2 - First Message" --repo "${{ github.repository }}" || true

      - name: Comment failure reason on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-1" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "❌ Step 1 check failed. See the [Actions log](../../actions/runs/${{ github.run_id }}) for details, fix your file, and push again."
          fi
