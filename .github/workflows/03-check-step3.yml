name: "Step 3 - Inspect Response"

# Disabled by default; enabled by Step 2's workflow. On success this opens
# Step 4's issue and enables the Step 4 checker, continuing the course.

on:
  push:
    branches: [main]
    paths:
      - "exercises/practice_inspect.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  check_step3:
    name: Verify Step 3 exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Run checker
        id: run_checker
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
        run: python .github/scripts/check_step3.py

      - name: Find open Step 3 issue
        if: success()
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-3" --state open --json number --jq '.[0].number')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment success + close issue
        if: success() && steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "✅ **Step 3 complete!** You inspected the full response object correctly. Opening Step 4 now..."
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

      - name: Open Step 4 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "step-4" --state all --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh label create "step-4" --color "0E8A16" --force 2>/dev/null || true
            gh label create "course" --color "5319E7" --force 2>/dev/null || true
            gh issue create \
              --repo "${{ github.repository }}" \
              --assignee "${{ github.actor }}" \
              --title "Step 4: Message roles and multi-turn conversations" \
              --label "step-4,course" \
              --body-file .github/steps/04-message-roles.md
          fi

      - name: Disable this workflow, enable Step 4 checker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "Step 3 - Inspect Response" --repo "${{ github.repository }}" || true
          gh workflow enable "Step 4 - Message Roles & Multi-turn" --repo "${{ github.repository }}" || true

      - name: Comment failure reason on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-3" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "❌ Step 3 check failed. See the [Actions log](../../actions/runs/${{ github.run_id }}) for details, fix your file, and push again."
          fi
