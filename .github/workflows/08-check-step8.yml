name: "Step 8 - Tool Use"

# Disabled by default. Step 7's workflow enables this one once the learner
# passes Step 7. Actions won't let a *disabled* workflow run automatically
# via push, but the enable/disable calls flip it into (in)active before the
# next relevant push arrives.

on:
  push:
    branches: [main]
    paths:
      - "exercises/practice8_tools.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  check_step8:
    name: Verify Step 8 exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Run checker
        id: run_checker
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
        run: python .github/scripts/check_step8.py

      - name: Find open Step 8 issue
        if: success()
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-8" --state open --json number --jq '.[0].number')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment success + close issue
        if: success() && steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "✅ **Step 8 complete!** You defined a tool, handled the tool_use block, and sent back a tool_result. Opening Step 9 now..."
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

      - name: Open Step 9 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "step-9" --state all --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh label create "step-9" --color "0E8A16" --force 2>/dev/null || true
            gh label create "course" --color "5319E7" --force 2>/dev/null || true
            gh issue create \
              --repo "${{ github.repository }}" \
              --assignee "${{ github.actor }}" \
              --title "Step 9: Extended thinking" \
              --label "step-9,course" \
              --body-file .github/steps/09-extended-thinking.md
          fi

      - name: Disable this workflow, enable Step 9 checker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "Step 8 - Tool Use" --repo "${{ github.repository }}" || true
          gh workflow enable "Step 9 - Extended Thinking" --repo "${{ github.repository }}" || true

      - name: Comment failure reason on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-8" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "❌ Step 8 check failed. See the [Actions log](../../actions/runs/${{ github.run_id }}) for details, fix your file, and push again."
          fi
