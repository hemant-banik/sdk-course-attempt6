name: "Step 20 - Web Search Tool"

# Disabled by default; enabled by Step 19's workflow. On success this opens
# Step 21's issue (the FINAL step) and enables the Step 21 checker.

on:
  push:
    branches: [main]
    paths:
      - "exercises/practice20_web_search.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  check_step20:
    name: Verify Step 20 exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Run checker
        id: run_checker
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
        run: python .github/scripts/check_step20.py

      - name: Find open Step 20 issue
        if: success()
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-20" --state open --json number --jq '.[0].number')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment success + close issue
        if: success() && steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "✅ **Step 20 complete!** Claude searched the live web and cited results for you. Opening Step 21 — the final step — now..."
          gh issue close "$ISSUE" --repo "${{ github.repository }}"

      - name: Open Step 21 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "step-21" --state all --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh label create "step-21" --color "0E8A16" --force 2>/dev/null || true
            gh label create "course" --color "5319E7" --force 2>/dev/null || true
            gh issue create \
              --repo "${{ github.repository }}" \
              --assignee "${{ github.actor }}" \
              --title "Step 21: Bedrock and Vertex client variants" \
              --label "step-21,course" \
              --body-file .github/steps/21-bedrock-vertex-clients.md
          fi

      - name: Disable this workflow, enable Step 21 checker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "Step 20 - Web Search Tool" --repo "${{ github.repository }}" || true
          gh workflow enable "Step 21 - Bedrock and Vertex Clients" --repo "${{ github.repository }}" || true

      - name: Comment failure reason on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --label "step-20" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "❌ Step 20 check failed. See the [Actions log](../../actions/runs/${{ github.run_id }}) for details, fix your file, and push again."
          fi
